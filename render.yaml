services:
  - type: web
    name: taft-aerospace-open-house
    env: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATA_DIR
        value: /var/data
    disk:
      name: station-data
      mountPath: /var/data
      sizeGB: 1
